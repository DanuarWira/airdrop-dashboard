name: Laporan Kutu (Bug Report)
description: Laporkan kendala teknis atau kesalahan tampilan di aplikasi AirdropViewer
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Mohon sertakan detail yang cukup agar pengembang dapat mereproduksi kendala tersebut.
  - type: textarea
    id: description
    attributes:
      label: Deskripsi Kendala
      placeholder: "Jelaskan apa yang terjadi dan apa yang seharusnya diharapkan..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah Mereproduksi
      placeholder: "1. Buka halaman...\n2. Klik tombol...\n3. Muncul error..."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Peramban (Browser) & Perangkat
      placeholder: "Contoh: Chrome 122 di macOS / Brave di Windows"
    validations:
      required: false
